<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>分析结果</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: transparent;
      font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    /* 浮窗容器：圆角 + 毛玻璃 + 阴影 */
    .card {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: rgba(255, 255, 255, .97);
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, .22);
      overflow: hidden;
    }

    /* 顶部拖动条 */
    .bar {
      -webkit-app-region: drag;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: linear-gradient(135deg, #1aad19 0%, #129c12 100%);
      color: #fff;
      flex: 0 0 auto;
    }

    .dot { width: 8px; height: 8px; border-radius: 50%; background: #b7f0b7; flex: 0 0 auto; }
    .dot.busy { animation: pulse 1s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: .45; transform: scale(.75); }
    }

    .title { font-size: 13px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .btns { -webkit-app-region: no-drag; display: flex; gap: 4px; }

    .btn {
      -webkit-app-region: no-drag;
      border: 0;
      background: rgba(255, 255, 255, .18);
      color: #fff;
      width: 22px;
      height: 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn:hover { background: rgba(255, 255, 255, .34); }

    /* 内容区：可选文本，方便复制 */
    .body {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 14px;
      font-size: 13px;
      line-height: 1.7;
      color: #1f2328;
      white-space: pre-wrap;
      word-break: break-word;
      user-select: text;
    }

    .body::-webkit-scrollbar { width: 8px; }
    .body::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .16); border-radius: 4px; }

    /* 状态样式 */
    .kind-tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 7px;
      border-radius: 8px;
      background: #eaf7ea;
      color: #129c12;
      margin-bottom: 8px;
    }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; color: #6b7280; gap: 10px; }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid #e5e7eb;
      border-top-color: #1aad19;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error { color: #b3261e; }

    .url { font-size: 11px; color: #6b7280; margin-top: 10px; word-break: break-all; }

    .foot {
      flex: 0 0 auto;
      padding: 8px 12px;
      border-top: 1px solid #eee;
      font-size: 11px;
      color: #9ca3af;
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }

    .kbd { background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 4px; padding: 0 4px; font-family: monospace; }
  </style>
</head>

<body>
  <div class="card">
    <div class="bar">
      <span class="dot" id="dot"></span>
      <span class="title" id="title">微信消息 AI 助手</span>
      <span class="btns">
        <button class="btn" id="btnCopy" title="复制结果">⧉</button>
        <button class="btn" id="btnShrink" title="收起/展开">–</button>
        <button class="btn" id="btnClose" title="隐藏（Esc）">✕</button>
      </span>
    </div>
    <div class="body" id="body">
      <div class="loading">
        <div class="spinner"></div>
        <div>选中内容后按热键，结果会显示在这里</div>
      </div>
    </div>
    <div class="foot">
      <span>选中 → <span class="kbd">Ctrl+Alt+D</span></span>
      <span id="footRight"></span>
    </div>
  </div>

  <script>
    const api = window.wxai || {};
    const $ = (id) => document.getElementById(id);

    let lastText = '';
    let shrunk = false;

    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function render(data) {
      const dot = $('dot'), title = $('title'), body = $('body'), foot = $('footRight');
      dot.classList.remove('busy');
      const kind = data && data.kind || 'text';

      $('title').textContent = (data && data.title) || '分析结果';

      if (kind === 'loading') {
        dot.classList.add('busy');
        body.innerHTML = '<div class="loading"><div class="spinner"></div><div>' +
          esc((data && data.text) || '分析中…') + '</div></div>';
        foot.textContent = '请求 DeepSeek…';
        return;
      }

      const tagMap = {
        video: '视频解析', link: '链接', chat: '聊天记录',
        emoji: '表情包', image: '图片', text: '文字', empty: '无内容', error: '错误'
      };

      let html = '';
      if (kind === 'error') {
        html = '<div class="error">' + esc(data.text) + '</div>';
      } else {
        html = '<span class="kind-tag">' + esc(tagMap[kind] || kind) + '</span>\n' + esc(data.text || '');
      }
      if (data && data.url) html += '<div class="url">' + esc(data.url) + '</div>';

      body.innerHTML = html;
      lastText = (data && data.text) || '';
      foot.textContent = lastText ? `${lastText.length} 字` : '';
      // 自适应高度（内容短就矮一点）
      if (api.resizeOverlay) {
        const need = Math.min(880, Math.max(180, body.scrollHeight + 130));
        api.resizeOverlay(need);
      }
    }

    if (api.onResult) api.onResult(render);

    $('btnClose').onclick = () => api.hideOverlay && api.hideOverlay();
    $('btnCopy').onclick = async () => {
      if (!lastText) return;
      try { await navigator.clipboard.writeText(lastText); $('btnCopy').textContent = '✓'; }
      catch (e) { $('btnCopy').textContent = '✕'; }
      setTimeout(() => { $('btnCopy').textContent = '⧉'; }, 1200);
    };
    $('btnShrink').onclick = () => {
      shrunk = !shrunk;
      document.querySelector('.body').style.display = shrunk ? 'none' : 'block';
      document.querySelector('.foot').style.display = shrunk ? 'none' : 'flex';
      if (api.resizeOverlay) api.resizeOverlay(shrunk ? 46 : 420);
    };

    // Esc 隐藏
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') api.hideOverlay && api.hideOverlay();
    });
  </script>
</body>

</html>

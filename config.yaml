# ============ 微信消息 AI 助手 配置 ============

# 消息源：weflow（你已在用的 WeFlow HTTP API）或 wcferry（注入微信进程）
message_source:
  type: wcferry          # weflow | wcferry
  # WeFlow 本地 API 地址（type=weflow 时生效）
  weflow_base: "http://127.0.0.1:5031"

# AI 总结（DeepSeek，OpenAI 兼容接口）
ai:
  base_url: "https://api.deepseek.com/v1"
  api_key: "sk-xxxxxxxx"          # 换成你的 key
  model: "deepseek-chat"
  max_tokens: 800
  # 可选：表情包/图片识别用的视觉模型（DeepSeek 暂无视觉，可填
  # qwen-vl-max / gpt-4o-mini / glm-4v 等 OpenAI 兼容的多模态模型）
  vision_model: ""

# 视频/链接解析
video:
  enabled: true
  # 视频平台域名白名单（命中才走「下载字幕→AI 总结」）
  platforms:
    - bilibili.com
    - b23.tv
    - youtube.com
    - youtu.be
    - douyin.com
    - v.douyin.com
    - xiaohongshu.com
    - kuaishou.com
    - weibo.com
  # 是否抓评论区（YouTube 走 yt-dlp，B站走 wbi 签名直连；失败静默降级）
  fetch_comments: true
  # 是否优先用 video-link-pipeline（需自行安装 `vlp` 命令；否则用本地 yt-dlp 流程）
  use_pipeline: false

# 汇总频率（按用户确定的分层规则）
#   免打扰/折叠群 → 每周一次
#   活跃群/整体   → 每天出统计
#   @我的         → 实时抽出（配置见 focus.notify_at_me）
#   视频/链接     → 实时秒级解析
schedule:
  muted_group_weekly: "sun 21:00"   # 免打扰/折叠群：每周日 21:00 汇总一次
  daily_stats: "21:00"              # 活跃群/整体：每天 21:00 出统计
  realtime_video: true              # 选中/收到视频链接 → 实时解析推送
  realtime_at_me: true              # @我的 → 实时抽出推送

# 选中即分析（划词 → DeepSeek → 悬浮输出）
selection:
  enabled: true
  # 全局热键：选中内容后按下即分析
  hotkey: "ctrl+alt+d"
  # 悬浮窗（桌面端）：结果浮在屏幕右上角
  overlay:
    enabled: true
    width: 420
    height: 560
    opacity: 0.96
    position: "top-right"     # top-right | top-left | bottom-right | bottom-left
    auto_hide_sec: 0          # 0 = 不自动隐藏，按 Esc 关闭
  # 各类内容的处理方式
  kind:
    video: "realtime"         # 视频链接 → 实时解析（字幕+评论+总结）
    link: "ai"                # 普通链接 → AI 判断价值/风险
    chat: "ai"                # 聊天记录 → 主题+@我+回复候选
    text: "ai"                # 长段文字 → 摘要+要点+待办
    emoji: "vision"           # 表情包 → 视觉模型识别（需配 vision_model）

# 推送通道（可多个同时开）
push:
  # Server 酱（推送到你微信服务号） https://sct.ftqq.com
  serverchan_key: ""              # SCT 开头的 SendKey
  # PushPlus  https://www.pushplus.plus
  pushplus_token: ""
  # 企业微信群机器人 webhook（推到你自己的企微群）
  wecom_webhook: ""
  # 桌面 Toast 通知（Windows，电脑在线时最直观）
  toast: true
  # 桌面悬浮窗（选中分析的结果显示在这里）
  overlay: true
  # 落盘 txt（兜底，永远可用）
  txt_file: "output/summary.txt"

# 关注对象 / 群分组
focus:
  contacts: []        # 关注的私聊对象（wxid），留空 = 全部；命中则出「回复建议」
  # 免打扰 / 折叠群（这些群 → 每周汇总一次）
  muted_rooms: []
  # 活跃群（这些群 → 每天出统计）；留空则自动取当天消息量 top 5
  active_rooms: []
  # 有人 @我 时立即抽出并推送
  notify_at_me: true

# 数据落库
db:
  path: "data/msgs.db"

# 开机补读本地库（解决「关机期间消息」）：解密微信本地数据库，补读漏掉的消息
backfill:
  enabled: true           # 关闭则不做补读
  lookback_hours: 24      # 首次运行时只补最近 24h（后续按上次运行时间补）

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>微信消息 AI 助手</title>
  <meta name="theme-color" content="#07C160">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon-192.png">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/static/icon.svg" alt="" class="logo">
      <div>
        <h1>微信消息 AI 助手</h1>
        <p class="sub">后台监听 · AI 总结 · 多端推送</p>
      </div>
    </div>
    <div class="status"><span id="status-dot" class="dot"></span><span id="status-text">连接中…</span></div>
  </header>

  <main>
    <!-- 统计卡片 -->
    <section class="grid stats">
      <div class="card">
        <div class="card-title">消息总数</div>
        <div class="big-num" id="stat-total">—</div>
      </div>
      <div class="card span2">
        <div class="card-title">热词 Top</div>
        <div class="tags" id="stat-words">暂无数据</div>
      </div>
      <div class="card">
        <div class="card-title">微信表情 Top</div>
        <div class="tags" id="stat-wxemoji">暂无数据</div>
      </div>
      <div class="card">
        <div class="card-title">Emoji Top</div>
        <div class="tags" id="stat-emoji">暂无数据</div>
      </div>
    </section>

    <!-- 操作 -->
    <section class="actions">
      <button class="btn" id="btn-daily">立即出「每日统计」（活跃群/整体）</button>
      <button class="btn btn-ghost" id="btn-weekly">立即出「每周汇总」（免打扰群）</button>
      <span class="hint" id="action-hint"></span>
    </section>

    <!-- 选中即分析：粘贴/输入内容 → DeepSeek → 结果 -->
    <section class="card analyze">
      <div class="card-title">
        选中即分析
        <span class="hint" id="hotkey-hint">桌面版：选中内容后按 Ctrl+Alt+D，结果浮在屏幕上</span>
      </div>
      <textarea id="sel-input" rows="4"
        placeholder="把聊天记录 / 长段文字 / 视频链接粘到这里，或直接点「分析选中内容」自动读取剪贴板…"></textarea>
      <div class="actions">
        <button class="btn" id="btn-analyze">分析这段内容</button>
        <button class="btn btn-ghost" id="btn-analyze-clip">分析剪贴板</button>
        <select id="sel-kind" class="sel">
          <option value="">自动判断类型</option>
          <option value="chat">当作聊天记录</option>
          <option value="text">当作长段文字</option>
          <option value="link">当作链接</option>
          <option value="video">当作视频</option>
          <option value="emoji">当作表情包</option>
        </select>
        <span class="hint" id="analyze-hint"></span>
      </div>
      <div class="analyze-out" id="analyze-out"></div>
    </section>

    <!-- 双栏：消息流 + 汇总 -->
    <section class="grid twocol">
      <div class="card">
        <div class="card-title">实时消息流</div>
        <ul class="feed" id="feed"><li class="empty">等待新消息…</li></ul>
      </div>
      <div class="card">
        <div class="card-title">历史汇总</div>
        <ul class="feed" id="summaries"><li class="empty">暂无汇总</li></ul>
      </div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
